name: col-taxdata Issue State

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: col-taxdata-issue-state-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Project machine-readable lifecycle state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 col-taxdata/ci/issue_state_sync.py event --repository "${GITHUB_REPOSITORY}" --event "${GITHUB_EVENT_PATH}"
