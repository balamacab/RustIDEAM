problem_text: |-
  Dos SAS colombianas pertenecientes al mismo grupo planean una fusión por absorción con efectos jurídicos en diciembre de 2026. La absorbida tiene inventarios, maquinaria depreciable, una cuenta por cobrar a una vinculada, pérdidas fiscales pendientes y diferencias entre valores contables y fiscales. Los accionistas de la absorbida recibirán participaciones en la absorbente y no se prevén pagos en dinero distintos de ajustes menores de cierre. La operación se realizará con estados financieros de corte especial y se registrará mercantilmente antes de finalizar 2026.
  
  Las compañías preguntan: (1) qué requisitos tributarios deben verificarse para determinar si la fusión puede recibir el tratamiento fiscal aplicable a reorganizaciones empresariales; (2) cómo deben conservarse o trasladarse los costos fiscales de activos y pasivos; (3) qué limitaciones pueden afectar el uso posterior de pérdidas fiscales de la absorbida; (4) qué efectos pueden surgir frente a IVA, retenciones y obligaciones formales durante el cierre y transición; y (5) qué hechos o documentos adicionales deben permanecer sin resolver si el expediente no permite concluir alguno de esos puntos.
