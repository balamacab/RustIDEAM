problem_text: |-
  Una persona natural residente fiscal en Colombia obtuvo durante el año gravable 2025 ingresos brutos por 1.100 UVT y tenía un patrimonio bruto de 3.900 UVT al 31 de diciembre de 2025. Los dos valores están expresados usando la UVT del año 2025. Sus ingresos provinieron de actividades digitales prestadas por cuenta propia. A 27 de septiembre de 2026 quiere saber qué condiciones legales deben revisarse para establecer si estaba obligada a presentar declaración de renta por el año gravable 2025, qué parte puede evaluarse de forma objetiva con esos datos y qué aspectos no pueden concluirse sin información adicional.
