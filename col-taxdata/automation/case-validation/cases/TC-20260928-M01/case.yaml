problem_text: |-
  Una SAS colombiana vende en octubre de 2026 una máquina industrial usada que llevaba cuatro años registrada como propiedad, planta y equipo y que fue utilizada exclusivamente en su actividad productiva. El comprador es otra sociedad colombiana responsable del IVA. El precio de venta es COP 180.000.000 y el costo fiscal y la depreciación acumulada difieren del valor contable. La sociedad vendedora pregunta: (1) si la operación causa IVA; (2) cómo debe analizarse para renta la utilidad o pérdida en la venta del activo; (3) si procede retención en la fuente sobre el pago; y (4) qué soportes y valores deben conservarse para sustentar el tratamiento.
