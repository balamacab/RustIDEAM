  - "export-of-services"
problem_text: |-
  Una SAS colombiana responsable del IVA presta desde Bogotá servicios de analítica y optimización de campañas digitales a una sociedad domiciliada en Canadá. El cliente extranjero no tiene domicilio, sucursal, establecimiento permanente, empleados ni activos en Colombia. El trabajo se ejecuta desde Colombia, pero los informes, tableros y recomendaciones se usan exclusivamente por el cliente para campañas dirigidas a Canadá y Chile; no se usan ni se explotan en Colombia. La SAS conserva contrato escrito, facturas, comprobantes bancarios, entregables y constancias de aceptación del cliente. En agosto de 2026 factura y recibe el pago del servicio. A 27 de septiembre de 2026 pregunta si el servicio puede tratarse como exportación de servicios para efectos del IVA y qué requisitos, autoridades y soportes deben revisarse para sustentar ese tratamiento.
